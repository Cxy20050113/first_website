<!Doctype html>
<html>
    <head>
    <meta charset="UTF -8">
    <title> 
        陈欣怡的第一个网页
    </title>
    <style>
        /* 点击后的颜色会通过JavaScript设置 */
        #demo2{
            /* 默认颜色不设置，使用浏览器默认文字颜色 */
            cursor: pointer; /* 鼠标变为手型，提示可点击 */
        }
    </style>
    <script>
        function showtext() {
            var element = document.getElementById("demo2");
            element.innerHTML="喜欢你";
            element.style.color = "rgb(236, 15, 125)"; // 点击后变为粉色
        }
    </script>
    </head>

    <body>  
        <h1>
            我是大王！
        </h1>
        <p id="demo1" style="color:rgb(232, 179, 208);font-size: 20px;"> 
            魏嘉豪是笨蛋
        </p>
        <script>
            function myFunction() {
                x=document.getElementById("demo1");
            x.innerHTML="没关系~我喜欢笨蛋魏嘉豪！";
            }
        </script>
        <button type="button" onclick="myFunction()">不服气嘛！！</button>
 <!--hr 添加水平分割线 -->
        <hr>
        <p>
            在和魏嘉豪谈恋爱！
<!--br不增加段落情况下换行-->
            <br>
            魏嘉豪在干什么呢？
        </p>
<!--a标签：链接到其他网页
        <a href="https://wx2.sinaimg.cn/orj360/007UNEfOly1i37s3i8iw9j31400u0dnb.jpg" style="color: rgb(240, 180, 210); font-size: 18px;">贴贴
        </a>-->
<!--// id:为元素指定唯一的标识符。-->
        <div id="header">(≧∇≦)ﾉ</div>
<!--// 为元素指定一个或多个类名，用于 CSS 或 JavaScript 选择-->
        <p class="text highlight">(≧∇≦)ﾉ</p>
<!--// 直接在元素p上使用CSS样式-->
        <p style="color: rgb(255, 207, 231); font-size: 14px;">(≧∇≦)ﾉ</p>

<p > 下面↓有一个在喜欢你！你来摸摸看~</p>
        

<b> (≧∇≦)ﾉ</b><br></br>
<!--斜体-->
<i> (≧∇≦)ﾉ</i><br></br>
<!--// 为缩写HTML做解释 title：在鼠标悬停的时候显示-->
<abbr title="喜欢你">(≧∇≦)ﾉ</abbr><!--加粗-->
<br></br>
<!--点击触发文字：喜欢你-->
<p id="demo2" onclick="showtext()">(≧∇≦)ﾉ</p>
<!--下划线-->
<u> (≧∇≦)ﾉ</u><br></br>
<!--电脑自动输出-->
<code> (≧∇≦)ﾉ </code><br></br>

    </body>
</html>
